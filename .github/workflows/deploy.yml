name: Deploy Backend to Raspberry Pi

on:
  push:
    branches: [ cicd ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Update Backend Container
        run: |
          docker build -t affordstack-backend:latest .
          docker stop affordstack-backend backend || true
          docker rm affordstack-backend backend || true
          docker run -d \
            --name affordstack-backend \
            --network-alias backend \
            --restart always \
            --network app-network \
            -e ConnectionStrings__DefaultConnection="Host=postgres_db;Port=5432;Database=affordstack_db;Username=devuser;Password=devpassword123;Include Error Detail=true" \
            -e CASHFREE_APP_ID="${{ secrets.CASHFREE_APP_ID }}" \
            -e CASHFREE_SECRET_KEY="${{ secrets.CASHFREE_SECRET_KEY }}" \
            -e Cashfree__AppId="${{ secrets.CASHFREE_APP_ID }}" \
            -e Cashfree__SecretKey="${{ secrets.CASHFREE_SECRET_KEY }}" \
            -e Cashfree__Environment="SANDBOX" \
            affordstack-backend:latest
          docker image prune -f
